name: BuildPusher deploy
description: Deploy the pushed commit to a BuildPusher environment and wait for it, failing the job if the deploy fails.
author: BuildPusher
branding:
  icon: upload-cloud
  color: blue
inputs:
  token:
    description: A BuildPusher API token with the Deploy scopes (store it as a secret).
    required: true
  project:
    description: The project's slug, name or ID.
    required: true
  environment:
    description: The environment's slug, name or ID.
    required: false
    default: production
  ref:
    description: The branch, tag or commit to deploy. Defaults to the commit that triggered the workflow.
    required: false
    default: ''
  wait:
    description: Wait for the deploy to finish and fail the job if it fails.
    required: false
    default: 'true'
  url:
    description: The BuildPusher address, for self-hosted installations.
    required: false
    default: https://buildpusher.com
runs:
  using: composite
  steps:
    - name: Install the BuildPusher CLI
      shell: bash
      run: |
        command -v php >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
        curl -fsSL "${{ inputs.url }}/cli/buildpusher" -o "$RUNNER_TEMP/buildpusher"
        php -l "$RUNNER_TEMP/buildpusher" >/dev/null
        chmod +x "$RUNNER_TEMP/buildpusher"
    - name: Deploy
      shell: bash
      env:
        BUILDPUSHER_TOKEN: ${{ inputs.token }}
        BUILDPUSHER_URL: ${{ inputs.url }}
        BP_PROJECT: ${{ inputs.project }}
        BP_ENVIRONMENT: ${{ inputs.environment }}
        BP_REF: ${{ inputs.ref || github.sha }}
        BP_WAIT: ${{ inputs.wait }}
      run: |
        args=(deploy "$BP_PROJECT" "$BP_ENVIRONMENT" "--ref=$BP_REF")
        if [ "$BP_WAIT" = "true" ]; then args+=(--wait); fi
        "$RUNNER_TEMP/buildpusher" "${args[@]}"
