    get:
      tags: [SCIM]
      summary: What the SCIM service supports
      security: [{ scimToken: [] }]
      responses:
        '200': { description: "The service provider configuration." }
        '401': { description: "Missing or invalid SCIM token." }
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: List provisioned people, filtered by userName eq or externalId eq
      security: [{ scimToken: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        '200': { description: "A ListResponse." }
        '400': { description: "Unsupported filter." }
        '401': { description: "Missing or invalid SCIM token." }
    post:
      tags: [SCIM]
      summary: Provision someone (userName is their email address)
      security: [{ scimToken: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object }
      responses:
        '201': { description: "The new User." }
        '400': { description: "userName isn't an email address, or its domain isn't allowed." }
        '403': { description: "The account's member limit is reached." }
        '409': { description: "Already provisioned." }
  /scim/v2/Users/{id}:
    get:
      tags: [SCIM]
      summary: One provisioned person
      security: [{ scimToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "The User." }
        '404': { description: "No such user." }
    put:
      tags: [SCIM]
      summary: Replace a person (active false removes their membership)
      security: [{ scimToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object }
      responses:
        '200': { description: "The User." }
        '404': { description: "No such user." }
        '409': { description: "The last owner can't be removed." }
    patch:
      tags: [SCIM]
      summary: Change a person with PatchOp operations (active, externalId)
      security: [{ scimToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object }
      responses:
        '200': { description: "The User." }
        '404': { description: "No such user." }
        '409': { description: "The last owner can't be removed." }
    delete:
      tags: [SCIM]
      summary: Deprovision a person
      security: [{ scimToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: "Removed." }
        '404': { description: "No such user." }
        '409': { description: "The last owner can't be removed." }
