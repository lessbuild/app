  /repositories/{repository}/webhook:
    post:
      tags: [Webhooks]
      summary: Push and pull-request webhooks from GitHub, GitLab or Bitbucket
      description: Signed with the repository's webhook secret (GitHub/Bitbucket HMAC headers, GitLab signing token). The JSON `status` says what happened.
      security: []
      parameters: [{ name: repository, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: "Ignored, skipped, duplicate, or a preview status." }
        '202': { description: "A deploy or preview is queued, or waiting behind a running deploy." }
        '401': { description: "Bad signature." }
        '404': { description: "Unknown repository, or push deploys are off." }
        '409': { description: "The repository can't deploy (website or server not ready)." }
        '413': { description: "The payload is too large." }
        '422': { description: "The payload isn't usable." }
