  /mcp:
    post:
      tags: [Assistant]
      summary: Model Context Protocol (JSON-RPC 2.0) for AI tools
      description: >-
        Send one JSON-RPC message per request: initialize, ping, tools/list or tools/call. Tools: list_projects
        (projects:read), recent_deploys (deploy:read), deploy_impact, error_issues, monitors and incidents
        (monitoring:read), list_analytics_sites and analytics_summary (analytics:read), servers (infrastructure:read).
        tools/list only lists the tools the token's scopes allow. Notifications are accepted with 202.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [jsonrpc, method], properties: { jsonrpc: { type: string, enum: ['2.0'] }, id: {}, method: { type: string }, params: { type: object } } }
      responses:
        '200': { description: "A JSON-RPC result or error." }
        '202': { description: "A notification was received." }
        '401': { description: "Missing or invalid token." }
