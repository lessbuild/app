name: CI

on:
  push:
    branches: [platform-v3]
  pull_request:
    branches: [platform-v3]

# The Laravel application (the API) lives in api/.
defaults:
  run:
    working-directory: api

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'platform' || ':memory:' }}
      DB_USERNAME: platform
      DB_PASSWORD: platform
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # The Filament admin panel's theme (api/public/build), built here because the server is too small to build it.
  admin-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The theme imports Filament's own CSS from vendor/.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-theme
          path: api/public/build
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # npm run messages fails on a missing translation; the build is a self-contained Node server in .output.
      - run: npm run messages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-server
          path: web/.output
          include-hidden-files: true
          retention-days: 7
